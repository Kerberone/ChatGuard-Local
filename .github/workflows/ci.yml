name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go host tests
        run: go test ./host
      - name: Native test helper
        run: go build -o /tmp/chatguard-test-host ./host
      - name: Browser extension tests (including native host protocol)
        run: CHATGUARD_HOST_TEST_BIN=/tmp/chatguard-test-host npm test
      - name: Cross-compile Windows host
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /tmp/ChatGuardLocalHost.exe ./host
